name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the older run of that pull
# request. A push to main gets a group of its own (its commit), so that no
# run on main is cancelled or dropped and every merge commit is tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Build, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Vet and the tests compile every package, test files included.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -timeout 120s ./...

  # The published images are built without cgo for several architectures.
  # Vet and link for each of them, test files included, so that code which
  # only builds on one architecture, or only with cgo, is caught here and
  # not at release time.
  cross:
    name: Compile for linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386", arm, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache key of this action does not include the target
          # architecture, so the matrix jobs would overwrite each other's
          # entry and restore the wrong one. These builds are small.
          cache: false

      # The main job already vets amd64.
      - name: Vet
        if: matrix.arch != 'amd64'
        run: go vet ./...

      # Link the program the way the Dockerfile does.
      - name: Link the program
        run: go build -ldflags "-X main.GitCommit=ci" -o /dev/null ./cmd/nanit/*.go

      # A 386 program runs on the amd64 runner, so the tests can run on a
      # 32-bit target too. The race detector does not exist for 386.
      - name: Test (32-bit)
        if: matrix.arch == '386'
        run: go test -count=1 -timeout 120s ./...

  # The image is what people run. Build it the way a deployment does, and
  # start the program in it once.
  image:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build --build-arg CI_COMMIT_SHORT_SHA="${GITHUB_SHA::7}" -t nanit:ci .

      # Without settings the program starts, and stops with the name of
      # the one setting that it needs.
      - name: Start the program in the image
        run: |
          output="$(docker run --rm nanit:ci 2>&1 || true)"
          echo "$output"
          echo "$output" | grep -q "Missing environment variable NANIT_RTMP_ADDR"

      - name: Check the tools of the setup script
        run: docker run --rm --entrypoint bash nanit:ci -c 'command -v curl && command -v jq && test -x /app/scripts/init-nanit.sh'

      # A container gets SIGTERM when it is stopped. The program must end
      # in order then, and well within the time that a container gets.
      - name: Stop the program in a container
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          printf '{"revision":3,"authToken":"x","authTime":"%s","babies":[{"uid":"b1","name":"B","camera_uid":"c1"}],"refreshToken":"r"}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/data/session.json"

          # No network: the program must not reach the real service with
          # the made-up session of this test
          docker run -d --name stop-test --network none -e NANIT_RTMP_ADDR=127.0.0.1:1935 -v "$RUNNER_TEMP/data:/data" nanit:ci
          sleep 5

          docker stop -t 10 stop-test
          docker logs stop-test

          test "$(docker inspect stop-test --format '{{.State.ExitCode}}')" = "0"
          docker logs stop-test 2>&1 | grep -q "Clean exit"

      - name: Check the compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet
        env:
          NANIT_RTMP_ADDR: 192.0.2.1:1935
          NANIT_DATA_PATH: /tmp/nanit-data
